name: Build Matabaat APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      HAS_STABLE_SIGNING: ${{ secrets.MATABAAT_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure stable signing key
        if: env.HAS_STABLE_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MATABAAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MATABAAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MATABAAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MATABAAT_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/matabaat-release.jks"
          {
            echo "MATABAAT_KEYSTORE_PATH=$RUNNER_TEMP/matabaat-release.jks"
            echo "MATABAAT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MATABAAT_KEY_ALIAS=$KEY_ALIAS"
            echo "MATABAAT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build stable signed APK
        if: env.HAS_STABLE_SIGNING == 'true'
        run: gradle --no-daemon :app:assembleRelease
      - name: Build temporary debug APK until stable key is configured
        if: env.HAS_STABLE_SIGNING != 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload stable release APK
        if: env.HAS_STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Matabaat-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload temporary debug APK
        if: env.HAS_STABLE_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Matabaat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
